# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Pinned to the targeted SonarQube Community Build (26.11), bumped together by hand when targeting a newer one:
      # sonar.api.version is also pluginApiMinVersion, and a server with an older plugin API refuses the plugin.
      - dependency-name: "org.sonarsource.api.plugin:*"
      - dependency-name: "org.sonarsource.sonarqube:*"
      - dependency-name: "org.sonarsource.scanner.engine:*"

  - package-ecosystem: "github-actions" # SHA-pinned actions in .github/workflows
    directory: "/"
    schedule:
      interval: "weekly"
