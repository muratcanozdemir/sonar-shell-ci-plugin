name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SonarQube blame / new-code detection
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install ShellCheck
        # same release as docker/scanner.Dockerfile and the generated rules (Ubuntu's package is older)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.gz" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Build and test
        # verify writes target/site/jacoco/jacoco.xml; copied dependencies let SonarQube resolve types
        run: ./mvnw -B -ntp verify dependency:copy-dependencies

      - name: Test tools (Python) with coverage
        # runs coverage.py in a python container unless it is installed (system pip is externally managed on Ubuntu runners)
        run: scripts/test-tools.sh

      - name: Vulnerability scan (osv-scanner)
        # pinned, checksum-verified binary; fails the build on any known vulnerability in pom.xml dependencies
        run: scripts/osv-scan.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-jar
          path: target/sonar-shell-ci-plugin-*.jar
          if-no-files-found: error

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
