# Analysis of this repository itself. CI analyzes it on SonarQube Cloud (Java and Python; the organization comes from
# the SONAR_ORGANIZATION repository variable). On a local SonarQube with the plugin installed (scripts/scan.sh), the
# workflows and scripts are analyzed by the plugin too.
sonar.projectKey=sonar-shell-ci-plugin
sonar.projectName=Shell & CI plugin for SonarQube
# x-release-please-start-version
sonar.projectVersion=1.0.0
# x-release-please-end

sonar.sources=src/main,tools,scripts,.github
sonar.tests=src/test/java,tools/tests
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.libraries=target/dependency/*.jar

# Test results and coverage produced by "./mvnw verify" (JaCoCo)
sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# Python tests of tools/ ("scripts/test-tools.sh")
sonar.python.coverage.reportPaths=target/python-coverage.xml
sonar.sourceEncoding=UTF-8

# Fixtures are intentionally vulnerable/broken; keep them out of the analysis. tools/tests are tests, not sources.
sonar.exclusions=src/test/resources/**,tools/tests/**
